version: 2
project_name: fortix

builds:
  - id: fortix
    main: ./cmd/fortix
    binary: fortix
    env: [CGO_ENABLED=0]
    goos: [darwin, linux]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w -X github.com/avhn/fortix/internal/buildinfo.Version={{.Version}}
  - id: fortix-helper
    main: ./cmd/fortix-helper
    binary: fortix-helper
    env: [CGO_ENABLED=0]
    goos: [darwin, linux]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w -X github.com/avhn/fortix/internal/buildinfo.Version={{.Version}}
  - id: tray-linux
    main: ./cmd/fortix-tray
    binary: fortix-tray
    env: [CGO_ENABLED=0]
    goos: [linux]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w -X github.com/avhn/fortix/internal/buildinfo.Version={{.Version}}
  # The macOS desktop is distributed as a Swift app, separately from CLI archives.

archives:
  - id: fortix
    ids: [fortix, fortix-helper, tray-linux]
    # Linux includes its tray; macOS CLI archives contain only CLI and helper.
    allow_different_binary_count: true
    formats: [tar.gz]
    # Package-channel templates and the combined manifest rely on these basenames.
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files: [LICENSE, README.md, THIRD_PARTY_NOTICES.txt]
    builds_info:
      owner: root
      group: root

checksum:
  name_template: checksums.txt

nfpms:
  - id: deb
    package_name: fortix
    ids: [fortix, fortix-helper, tray-linux]
    formats: [deb]
    file_name_template: "{{ .PackageName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    vendor: fortix
    homepage: https://github.com/avhn/fortix
    maintainer: Mert Dede <doganmertdede@gmail.com>
    description: FortiGate SSL VPN profile manager with a CLI and desktop tray.
    license: GPL-3.0-or-later
    bindir: /usr/libexec/fortix
    dependencies: [iproute2]
    recommends: [openfortivpn, ppp]
    contents:
      - src: LICENSE
        dst: /usr/share/doc/fortix/copyright
      - src: THIRD_PARTY_NOTICES.txt
        dst: /usr/share/doc/fortix/THIRD_PARTY_NOTICES.txt
      - src: /usr/libexec/fortix/fortix
        dst: /usr/bin/fortix
        type: symlink
      - src: /usr/libexec/fortix/fortix-tray
        dst: /usr/bin/fortix-tray
        type: symlink
      - src: packaging/fortix-helper.service
        dst: /usr/lib/systemd/system/fortix-helper.service
        file_info:
          owner: root
          group: root
          mode: 0644
    scripts:
      postinstall: packaging/postinst
      preremove: packaging/prerm
      postremove: packaging/postrm
